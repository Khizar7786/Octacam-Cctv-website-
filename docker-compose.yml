services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: octacam
      POSTGRES_USER: octacam
      POSTGRES_PASSWORD: octacam_dev
    ports:
      - "5433:5432"
    volumes:
      - octacam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octacam -d octacam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  octacam_postgres:
